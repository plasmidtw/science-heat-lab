['課本 P68','堆積作用','被搬運的物質在移動過程中逐漸沉澱、堆積下來。','🏖️'],
['課本 P68–69','立霧溪上游','河道窄、坡度陡、水流急；侵蝕和搬運明顯。河床多有稜有角的大石塊。','🏔️💦'],
['思考','為什麼上游的石塊常有稜有角？','想想：石塊剛從岩壁崩落，與經過長距離搬運的石頭，有什麼不同？','🪨❓'],
['課本 P68–69','立霧溪中游','河道漸寬、坡度較緩、水流減緩；河床常有光滑、圓潤的鵝卵石。','🌊🪨'],
['課本 P68–69','立霧溪下游','河道寬廣、地勢平坦、水流緩慢；堆積明顯，常見泥和細沙，出海口有時形成三角洲。','🏞️'],
['比較','上游、中游、下游','上游：急流、大石塊｜中游：較緩、鵝卵石｜下游：緩流、泥沙堆積','🏔️ → 🏞️ → 🌊'],

['課本 P69','凹岸與凸岸','凹岸：流速較快、侵蝕較明顯。凸岸：流速較慢、堆積較明顯。','↪️🪨'],
['提問','坡度如何改變地表？','坡度較陡時，流水的侵蝕和搬運作用通常更明顯。','⛰️🌧️'],
['課本 P71','山區邊坡防護','豪大雨時，陡坡較容易發生土石流等災害；山區常設置邊坡防護措施。','🌧️🛡️'],
['課本 P72','海岸地形','海水也會侵蝕、搬運及堆積，塑造不同的海岸景觀。','🌊🏝️'],
['課本 P72','海蝕地形','海蝕崖：陡峭崖壁。海蝕平臺：接近海平面的平坦岩臺。海蝕洞受侵蝕可能形成海蝕拱門。','🌊🪨'],
['課本 P72','臺灣的海蝕地形','鼻頭角海蝕崖、澎湖七美海蝕平臺、蘭嶼情人洞。','🏝️'],
['課本 P73','海積地形','海浪與海水搬運泥沙，並在某些地方堆積，形成沙灘、沙洲、陸連島等景觀。','🏖️'],
['課本 P73','臺灣的海積地形','福隆沙灘、臺南七股新浮崙汕、臺東金樽陸連島。','🏝️🏖️'],
['統整','地表變動的線索','看水流速度、坡度、顆粒大小與海岸外觀，推測是侵蝕、搬運還是堆積。','🔎🌎'],

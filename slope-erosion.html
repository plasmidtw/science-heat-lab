<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>下雨了！坡度與流水作用實驗室</title>
<style>
:root{
  --bg:#eaf1f5; --card:#ffffff; --ink:#1c2b36; --mute:#566b7a; --line:#cfdbe3;
  --water:#2a7fc1; --soil:#8a5a36; --dep:#d9981f; --btn:#1f5f8b; --btnink:#fff; --soft:#dbe8f0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121c24; --card:#1b2a35; --ink:#e6eef4; --mute:#9fb3c1; --line:#2f4352; --water:#6cb6ee; --soil:#c58a5e; --dep:#f0b84a; --btn:#5aa9e0; --btnink:#0e1a22; --soft:#26394a;
}}
:root[data-theme="dark"]{
  --bg:#121c24; --card:#1b2a35; --ink:#e6eef4; --mute:#9fb3c1; --line:#2f4352; --water:#6cb6ee; --soil:#c58a5e; --dep:#f0b84a; --btn:#5aa9e0; --btnink:#0e1a22; --soft:#26394a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.pair .box{margin-bottom:0;padding:10px;min-width:0}@media(max-width:560px){.pair{grid-template-columns:1fr}}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:clamp(22px,4vw,30px);margin:4px 0 2px}
.sub{margin:0 0 14px;color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 20px}
.ctl label{display:block;font-weight:700;margin-bottom:2px}
.ctl .v{font-weight:800;color:var(--water)}
input[type=range]{width:100%;accent-color:var(--btn)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:56px}
button{font:inherit;font-weight:700;border:1.5px solid var(--btn);background:transparent;color:var(--btn);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:44px}
button.on{background:var(--btn);color:var(--btnink)}
button.go{background:var(--btn);color:var(--btnink);font-size:17px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--dep);outline-offset:2px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.prog{flex:1;min-width:120px;height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--water)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.ph b{font-size:18px}
canvas{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);background:#dcecf6}
.st{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:14px;color:var(--mute)}
.chip{padding:2px 10px;border-radius:12px;background:var(--soft);color:var(--mute);font-weight:700;transition:.15s}
.chip.on.e{background:#c8472f;color:#fff}.chip.on.t{background:var(--water);color:#fff}.chip.on.d{background:var(--dep);color:#1c1200}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin:0}
.leg span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-weight:800}
.concl{background:var(--soft);border-radius:8px;padding:12px;margin-top:8px}
.pred{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌧️ 下雨了！坡度與流水作用實驗室</h1>
  <p class="sub">兩個土堆同時淋雨。雨水會真的往下流、帶走泥沙、再放下泥沙，你來觀察看看。</p>

  <div class="box">
    <div class="ctl">
      <div><label for="sA">A 土堆坡度 <span class="v" id="vA"></span></label><input id="sA" type="range" min="5" max="45" step="1" value="40"></div>
      <div><label for="sB">B 土堆坡度 <span class="v" id="vB"></span></label><input id="sB" type="range" min="5" max="45" step="1" value="10"></div>
      <div><label>雨量</label><div class="seg" id="rainSeg"><button data-v="0.7">小雨</button><button data-v="1.4" class="on">中雨</button><button data-v="2.2">大雨</button></div></div>
      <div><label>播放速度</label><div class="seg" id="spdSeg"><button data-v="1">慢</button><button data-v="2" class="on">正常</button><button data-v="4">快</button></div></div>
    </div>
    <div style="margin-top:12px"><b>先猜猜看：</b>下雨後，泥沙被帶得比較遠的是哪一個土堆？
      <div class="pred" id="predSeg"><button data-v="A">A 土堆</button><button data-v="B">B 土堆</button><button data-v="same">差不多</button></div>
    </div>
    <div class="acts">
      <button class="go" id="go">▶ 開始下雨</button>
      <button id="reset">↺ 重設土堆</button>
      <div class="prog" aria-label="降雨進度"><i id="bar"></i></div>
    </div>
  </div>

  <div class="box">
    <p class="leg"><span style="--c:#2a7fc1">清水（流動中）</span><span style="--c:#8a5a36">褐色泥水層、褐色大圓點＝水帶著泥沙（搬運）</span><span style="--c:#d9981f">橘黃色＝新堆積的泥沙</span><span style="--c:#222">虛線＝下雨前的形狀（虛線內被挖掉＝侵蝕；後方是土堆的其他剖面）</span></p>
  </div>

  <div class="pair"><div class="box">
    <div class="ph"><b>A 土堆</b><span id="lA"></span></div>
    <canvas id="cA" width="560" height="230" aria-label="A 土堆模擬畫面"></canvas>
    <div class="st" id="stA"></div>
  </div>
  <div class="box">
    <div class="ph"><b>B 土堆</b><span id="lB"></span></div>
    <canvas id="cB" width="560" height="230" aria-label="B 土堆模擬畫面"></canvas>
    <div class="st" id="stB"></div>
  </div></div>

  <div class="box" id="res" hidden>
    <h2 style="margin:0 0 4px;font-size:20px">實驗結果</h2>
    <div id="pr"></div>
    <table><thead><tr><th>觀察項目</th><th>A 土堆</th><th>B 土堆</th></tr></thead><tbody id="tb"></tbody></table>
    <div class="concl" id="cc"></div>
    <p class="sub" style="margin:10px 0 0">想一想：把兩個土堆調成一樣的坡度再下一次雨，結果會一樣嗎？再試試不同的雨量。</p>
  </div>
</div>

<script>
const W=560,GY=200,X0=20,L=150,FOOT=X0+L,STEPS=1800;
const G=0.05,FR=0.98,FF=0.993,CAP=2,KE=0.02,KD=0.03;
const $=id=>document.getElementById(id);
const P={A:mk('A'),B:mk('B')};
let rain=1.4,spf=2,pred=null,running=false,steps=0,tail=0,raf=0;

const NL=5,OY=5;
function mk(k){const cv=$('c'+k);return{k,cv,x:cv.getContext('2d'),ln:[],ps:[],dr:[],er:0,f:{e:0,t:0,d:0},flux:new Float32Array(W)}}
function noise(){const r=[],a=new Float32Array(W);for(let k=0;k<W/8+2;k++)r.push(0.4+Math.random()*1.5);
  for(let i=0;i<W;i++){const k=i/8|0,t=(i%8)/8;a[i]=r[k]*(1-t)+r[k+1]*t}return a}
function init(p){
  const deg=+$('s'+p.k).value,H=L*Math.tan(deg*Math.PI/180);p.ln=[];
  for(let z=0;z<NL;z++){const o=new Float32Array(W),b=noise();
    for(let i=0;i<W;i++)o[i]=i<X0?H:i<FOOT?H*(1-(i-X0)/L)+(b[i]-1)*0.4:0;
    p.ln.push({o,h:o.slice(),dep:new Float32Array(W),ero:noise()})}
  p.ps=[];p.dr=[];p.er=0;p.f={e:0,t:0,d:0};p.flux.fill(0);
}
function step(p,on){
  if(on){let n=rain*3;while(n>0){if(Math.random()<Math.min(1,n))p.dr.push({x:Math.random()*380,y:0,z:(Math.random()*NL)|0});n--}}
  for(let j=p.dr.length-1;j>=0;j--){const d=p.dr[j],h=p.ln[d.z].h;d.y+=4;
    if(d.y>=GY-OY*d.z-h[d.x|0]){p.ps.push({x:d.x,z:d.z,v:0.02,l:0,a:0});p.dr[j]=p.dr[p.dr.length-1];p.dr.pop()}}
  for(let j=p.ps.length-1;j>=0;j--){const q=p.ps[j],ln=p.ln[q.z],h=ln.h,dep=ln.dep;
    let i=Math.min(W-2,Math.max(1,q.x|0));
    const s=(h[i-1]-h[i+1])/2;
    q.v=Math.max(0,(q.v+G*s/Math.hypot(1,s))*(s>0.06?FR:FF));
    q.x+=q.v;q.a++;
    i=Math.min(W-2,Math.max(1,q.x|0));
    const cap=CAP*q.v*q.v;
    if(q.l<cap){let e=Math.min((cap-q.l)*KE*ln.ero[i],h[i]);h[i]-=e;dep[i]=Math.max(0,dep[i]-e);q.l+=e;p.er+=e;p.f.e++}
    else{const d=(q.l-cap)*KD;h[i]+=d;dep[i]+=d;q.l-=d;p.f.d++}
    if(q.l>0.05)p.f.t++;
    p.flux[i]+=q.l;
    if((q.v<0.03&&q.a>8)||q.a>700||q.x>=W-2){h[i]+=q.l;dep[i]+=q.l;p.ps[j]=p.ps[p.ps.length-1];p.ps.pop()}
    else if(Math.random()<0.15){const nz=q.z+(Math.random()<.5?-1:1);if(nz>=0&&nz<NL&&p.ln[nz].h[i]<h[i]-0.25)q.z=nz}
  }
}
function slump(p){for(const ln of p.ln){const h=ln.h;for(let i=0;i<W-1;i++){const d=h[i]-h[i+1];
  if(d>1.15){const m=.3*(d-1.15);h[i]-=m;h[i+1]+=m}else if(d<-1.15){const m=.3*(-d-1.15);h[i]+=m;h[i+1]-=m}
  if(ln.dep[i]>h[i])ln.dep[i]=h[i]}}}
function stats(p){let md=0,far=0,m=0,mx=0;
  for(const ln of p.ln)for(let i=0;i<W;i++){const d=ln.o[i]-ln.h[i];if(d>md)md=d;
    if(i>=FOOT){if(ln.dep[i]>0.4&&i-FOOT>far)far=i-FOOT;m+=ln.dep[i];mx+=ln.dep[i]*(i-FOOT)}}
  return{depth:md/10,vol:p.er/NL/100,far:far/10,ctr:m>1?mx/m/10:0}}
function draw(p){
  const c=p.x;c.clearRect(0,0,W,230);
  const sky=c.createLinearGradient(0,0,0,GY);sky.addColorStop(0,rainOnVis?'#9db4c4':'#cfe4f1');sky.addColorStop(1,'#e6f1f8');
  c.fillStyle=sky;c.fillRect(0,0,W,GY);
  c.fillStyle='#8c8f86';c.fillRect(0,GY-OY*(NL-1),W,OY*(NL-1)+30);
  for(let z=NL-1;z>=0;z--){const ln=p.ln[z],oy=GY-OY*z;
    const soil=`rgb(${138+z*9},${90+z*11},${54+z*11})`;
    for(let i=0;i<W;i++){const h=ln.h[i];if(h<0.4)continue;const t=oy-h;
      c.fillStyle=soil;c.fillRect(i,t,1,h);
      if(ln.dep[i]>0.3){c.fillStyle='#d9981f';c.fillRect(i,t,1,Math.min(h,ln.dep[i]))}
      else if(i<FOOT&&ln.o[i]-h<0.3){c.fillStyle='#4f8a3a';c.fillRect(i,t-2,1,2)}}
    if(z===0){c.strokeStyle='#222';c.lineWidth=1.2;c.setLineDash([5,4]);c.beginPath();
      for(let i=0;i<W;i++){const y=oy-ln.o[i];i?c.lineTo(i,y):c.moveTo(i,y)}c.stroke();c.setLineDash([]);
      const F=p.flux;c.fillStyle='rgba(105,68,38,.6)';
      for(let i=1;i<W-1;i++){const f=(F[i-1]+F[i]+F[i+1])/3,th=Math.min(12,Math.sqrt(f)*1.4);
        if(th>0.8)c.fillRect(i,oy-ln.h[i]-th,1,th);F[i-1]*=0.93}}
    for(const q of p.ps){if(q.z!==z)continue;const m=Math.min(1,q.l/0.5);
      c.fillStyle=`rgb(${Math.round(42+110*m)},${Math.round(127-55*m)},${Math.round(193-150*m)})`;
      c.beginPath();c.arc(q.x,oy-ln.h[q.x|0]-2,2+1.6*m,0,6.3);c.fill()}
  }
  c.strokeStyle='#e8f4ff';c.lineWidth=1.2;c.beginPath();
  for(const d of p.dr){c.moveTo(d.x,d.y-6);c.lineTo(d.x,d.y)}c.stroke();
  c.fillStyle='#fff';c.font='14px sans-serif';c.textAlign='center';c.strokeStyle='#444';c.lineWidth=1;
  for(let k=0;k<=40;k+=5){const x=FOOT+k*10;if(x>W-10)break;
    c.beginPath();c.moveTo(x,GY);c.lineTo(x,GY+(k%10?5:9));c.stroke();if(k%10===0)c.fillText(k?k+' 公分':'坡腳',x,GY+24)}
  const sv=stats(p);
  if(sv.far>0.5){const x=FOOT+sv.far*10,t='最遠堆到 '+sv.far.toFixed(0)+' 公分';
    c.strokeStyle='#b3261e';c.fillStyle='#b3261e';c.lineWidth=2;
    c.beginPath();c.moveTo(FOOT,GY-24);c.lineTo(x,GY-24);c.moveTo(FOOT,GY-30);c.lineTo(FOOT,GY-18);c.moveTo(x,GY-34);c.lineTo(x,GY);c.stroke();
    c.font='bold 14px sans-serif';c.lineWidth=3;c.strokeStyle='#fff';c.strokeText(t,(FOOT+x)/2,GY-38);c.fillText(t,(FOOT+x)/2,GY-38);
    c.strokeStyle='#444';c.lineWidth=1;c.font='14px sans-serif'}
  c.textAlign='left';c.fillStyle='#223';c.fillText('水往右流 →',8,18);
}
let rainOnVis=false;
function ui(){
  for(const k of['A','B']){const p=P[k],s=stats(p);
    $('l'+k).textContent=$('s'+k).value+'°'+(+$('sA').value===+$('sB').value?'':(+$('s'+k).value>+$('s'+(k==='A'?'B':'A')).value?'（較陡）':'（較緩）'));
    $('st'+k).innerHTML=`<span class="chip e ${p.f.e?'on':''}">侵蝕</span><span class="chip t ${p.f.t?'on':''}">搬運</span><span class="chip d ${p.f.d?'on':''}">堆積</span><br>最大侵蝕深度 ${s.depth.toFixed(1)} 公分<br>泥沙最遠堆到距坡腳 ${s.far.toFixed(0)} 公分`;
    p.f={e:0,t:0,d:0}}
}
function loop(){
  if(!running)return;
  for(let k=0;k<spf;k++){
    const on=steps<STEPS;rainOnVis=on;
    for(const p of Object.values(P)){step(p,on);if(steps%5===0)slump(p)}
    steps++;if(!on)tail++;
  }
  $('bar').style.width=Math.min(100,steps/STEPS*100)+'%';
  draw(P.A);draw(P.B);ui();
  const left=P.A.ps.length+P.A.dr.length+P.B.ps.length+P.B.dr.length;
  if(steps>=STEPS&&(left===0||tail>900)){finish();return}
  raf=requestAnimationFrame(loop);
}
function finish(){
  running=false;rainOnVis=false;
  for(const p of Object.values(P)){for(const q of p.ps){const l=p.ln[q.z];l.h[q.x|0]+=q.l;l.dep[q.x|0]+=q.l}p.ps=[];p.dr=[]}
  slump(P.A);slump(P.B);draw(P.A);draw(P.B);
  for(const p of Object.values(P))p.f={e:0,t:0,d:0};
  ui();$('go').disabled=false;$('go').textContent='▶ 再下一次雨（先重設土堆）';
  lock(false);showRes();
}
function showRes(){
  const a=stats(P.A),b=stats(P.B),sa=+$('sA').value,sb=+$('sB').value;
  const who=a.far>b.far+2?'A':b.far>a.far+2?'B':'same';
  const rows=[['最大侵蝕深度',a.depth.toFixed(1)+' 公分',b.depth.toFixed(1)+' 公分'],
    ['被沖走的土量',a.vol.toFixed(0)+' 平方公分',b.vol.toFixed(0)+' 平方公分'],
    ['泥沙最遠堆到距坡腳',a.far.toFixed(0)+' 公分',b.far.toFixed(0)+' 公分'],
    ['堆積泥沙的中心位置',a.ctr.toFixed(0)+' 公分',b.ctr.toFixed(0)+' 公分']];
  $('tb').innerHTML=rows.map(r=>`<tr><td class="n">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  const nm={A:'A 土堆',B:'B 土堆',same:'差不多'};
  $('pr').innerHTML=pred?`<p>你的預測：<b>${nm[pred]}</b>，實驗結果：<b>${nm[who]}</b> ${pred===who?'✅ 猜對了！':'🔎 和預測不同，看看是為什麼？'}</p>`:'';
  let t;
  if(Math.abs(sa-sb)<4)t='兩個土堆的坡度很接近，所以侵蝕、搬運和堆積的差別不大。把其中一個調得更陡再試試！';
  else{const st=sa>sb?'A':'B',sv=st==='A'?a:b,gv=st==='A'?b:a,gn=st==='A'?'B':'A';
    t=`坡度較陡的 ${st} 土堆，水流比較快，所以<b>侵蝕</b>比較明顯（最深 ${sv.depth.toFixed(1)} 公分，${gn} 只有 ${gv.depth.toFixed(1)} 公分），也<b>搬運</b>了更多泥沙；水流到平地才變慢，泥沙被放下<b>堆積</b>，最遠堆到距坡腳 ${sv.far.toFixed(0)} 公分，比 ${gn} 土堆的 ${gv.far.toFixed(0)} 公分更遠。`}
  $('cc').innerHTML=t;$('res').hidden=false;$('res').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function lock(v){$('sA').disabled=$('sB').disabled=v}
function reset(){cancelAnimationFrame(raf);running=false;steps=0;tail=0;rainOnVis=false;init(P.A);init(P.B);
  draw(P.A);draw(P.B);ui();$('bar').style.width='0';$('res').hidden=true;$('go').disabled=false;$('go').textContent='▶ 開始下雨';lock(false)}
$('go').onclick=()=>{
  if(steps>=STEPS)reset();
  running=true;$('go').disabled=true;lock(true);$('res').hidden=true;loop()};
$('reset').onclick=reset;
for(const k of['A','B'])$('s'+k).oninput=()=>{$('v'+k).textContent=$('s'+k).value+'°';if(!running)reset()};
function seg(id,fn){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;
  [...$(id).children].forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v)}}
seg('rainSeg',v=>rain=+v);seg('spdSeg',v=>spf=+v);seg('predSeg',v=>pred=v);
$('vA').textContent=$('sA').value+'°';$('vB').textContent=$('sB').value+'°';
reset();
</script>
</body>
</html>
